spring.application.name=product-micro-service
server.port=8082

# Jasypt Anahtarı (Dışarıdan env dosyasından çekiliyor)
jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD}

# Veritabanı Bağlantısı - Aiven MySQL (Sıfır Hardcode)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/product_db?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Sürücü ve Hibernate/Liquibase Ayarları
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml